Lakata chou,

Aujourd'hui, c'est ton jour. Et avant toute chose, je veux te souhaiter un merveilleux anniversaire.

Je repense souvent à nos débuts. Qui aurait cru que deux personnes qui se croisaient en uniforme à l'ENA finiraient un jour en couple ? À l'époque, nous ne pouvions probablement pas imaginer tout ce que cette rencontre allait devenir.

Je me souviens de nos rires, de cette facilité que nous avions à nous comprendre, de nos discussions qui se prolongeaient jusqu'au petit matin. Nous avions toujours quelque chose à nous raconter. Même lorsque nous pensions avoir épuisé les sujets, nous trouvions encore une raison de continuer à parler.

Cette complicité avait quelque chose de particulier. Et je ne l'ai pas oubliée.

Je ne vais pas prétendre que tout est resté comme avant. Notre histoire a connu des moments difficiles et certaines choses ont changé. Il y a des attitudes, des paroles et des distances qui me font mal. Parfois, j'ai l'impression que nous ne savons même plus nous parler sans nous blesser.

Je ne veux pas faire comme si cela n'existait pas. Mais je ne veux pas non plus faire de ton anniversaire le procès de notre relation.

Je sais que je ne suis pas parfait. J'ai certainement eu des réactions, des paroles et des comportements qui ont contribué à cette situation. Je suis prêt à reconnaître ma part et à faire des efforts.

Mais j'aimerais aussi que nous puissions retrouver cette considération, cette douceur et cette envie de nous comprendre qui nous rapprochaient au début. J'aimerais que nos désaccords ne deviennent pas des occasions de nous menacer de séparation ou de nous faire du mal.

J'aimerais que nos engagements soient traités avec considération, même lorsque nous sommes en colère. J'aimerais aussi que nous puissions parler librement de nos attentes, de nos différences et de notre intimité, sans pression, sans jugement et sans que l'un de nous se sente obligé de renoncer à ce qu'il est.

Je ne te demande pas de devenir une autre personne. Je ne te demande pas non plus que tout change en un jour.

Je voudrais simplement que nous acceptions tous les deux de faire des efforts : apprendre à mieux communiquer, respecter nos différences, reconnaître nos erreurs, nous écouter réellement et ne jamais considérer l'autre comme acquis.

Je ne veux pas que nous restions ensemble uniquement parce que nous avons de beaux souvenirs. Je veux que nous ayons encore de belles raisons de choisir de construire ensemble.

De mon côté, je suis prêt à me remettre en question et à faire ma part. J'aimerais simplement sentir que tu souhaites, toi aussi, prendre soin de cette relation.

Si ton cœur en a aussi envie, j'aimerais que nous nous donnions une vraie chance de nous retrouver. Pas pour redevenir exactement ceux que nous étions à l'ENA, mais pour devenir deux personnes qui savent mieux s'aimer, se comprendre et se respecter.

Je ne veux pas seulement retrouver le couple de nos souvenirs. Je veux découvrir celui que nous pouvons encore devenir.

Mais aujourd'hui, je veux surtout célébrer la personne que tu es.

Je te souhaite la santé, la paix intérieure, la réussite dans tes projets, de belles opportunités et beaucoup de raisons de sourire. Que cette nouvelle année de ta vie t'apporte ce que ton cœur espère et même de belles surprises auxquelles tu ne t'attends pas.

Merci pour les beaux moments, pour ton attention dans ces instants où tu me fais sentir que je compte, pour ton amour et pour tous ces souvenirs qui ont une place particulière dans mon cœur.

Joyeux anniversaire, Lakata chou.

Profite de ta journée. Tu le mérites.`,
